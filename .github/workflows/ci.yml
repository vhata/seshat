name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh

  workflow:
    name: Queue and PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh

  deploy:
    name: Deploy production
    needs: [check, workflow]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.SESHAT_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: seshat-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update and verify the existing instance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESHAT_ACCOUNT_ID: ${{ vars.SESHAT_ACCOUNT_ID }}
          SESHAT_WORKER_NAME: ${{ vars.SESHAT_WORKER_NAME }}
          SESHAT_ORIGIN: ${{ vars.SESHAT_ORIGIN }}
          SESHAT_NAMESPACE_ID: ${{ vars.SESHAT_NAMESPACE_ID }}
        run: node src/cli/site-ci.ts
